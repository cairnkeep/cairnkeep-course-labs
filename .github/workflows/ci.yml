name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm install --no-save --ignore-scripts @cairnkeep/cli@2.13.0
      - run: scripts/test-skill-lab.sh
        env:
          CAIRN_COURSE_CORE_ROOT: ${{ github.workspace }}/node_modules/@cairnkeep/cli
